# Сборка dict-service (backend, import, frontend), ИИ (asana-network), backup-runner; push в Docker Hub и деплой на хост.
#
# Триггеры:
#   1) push в main, если в сообщении коммита есть токен «ver <тег>» (например: «release ver 2.0.8-beta»).
#   2) workflow_dispatch — поле version вручную.
#
# Secrets (Settings → Secrets → Actions):
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (приватный ключ SSH)
#   На сервере в /app/.env: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID — деплой шлёт алерт DeployCompleted в Alertmanager
#
# На сервере: каталог /app с файлом .env (БД, секреты). В .env добавится/обновится DICT_SERVICE_VERSION.
# Копируются: docker-compose.prod.yml → /app/docker-compose.yml, nginx.prod.conf → /app/nginx.prod.conf
# Все команды на хосте выполняются через sudo (нужен NOPASSWD для пользователя SSH или интерактивный sudo недоступен в CI).

name: Deploy dict service

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Тег образов (как в Docker Hub), напр. 2.0.8-beta"
        required: true
        type: string

concurrency:
  group: deploy-dict-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      deploy: ${{ steps.pick.outputs.deploy }}
    steps:
      - name: Определить версию из коммита или inputs
        id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          msg="${COMMIT_MSG:-}"
          ver=$(printf '%s' "$msg" | tr '\n' ' ' | grep -oiE 'ver[[:space:]]+[^[:space:]]+' | head -1 | sed -E 's/^ver[[:space:]]+//I' || true)
          if [ -z "$ver" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "В сообщении коммита нет «ver <тег>» — сборка и деплой пропущены." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "version=$ver" >> "$GITHUB_OUTPUT"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Версия: **$ver**" >> "$GITHUB_STEP_SUMMARY"
          fi

  validate-version:
    needs: resolve
    if: needs.resolve.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Проверить формат тега
        run: |
          v="${{ needs.resolve.outputs.version }}"
          echo "TAG=$v"
          echo "$v" | grep -qE '^[a-zA-Z0-9._-]+$'

  build-and-push:
    needs: [resolve, validate-version]
    if: needs.resolve.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./asana-dict-service/backend
          file: ./asana-dict-service/backend/Dockerfile
          push: true
          tags: plwatermelon/asana-backend:${{ needs.resolve.outputs.version }}

      - name: Import worker image
        uses: docker/build-push-action@v6
        with:
          context: ./asana-dict-service
          file: ./asana-dict-service/import-service/Dockerfile
          push: true
          tags: plwatermelon/asana-backend-import:${{ needs.resolve.outputs.version }}

      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./asana-dict-service/frontend
          file: ./asana-dict-service/frontend/Dockerfile
          push: true
          tags: plwatermelon/asana-frontend:${{ needs.resolve.outputs.version }}

      - name: AI / network service (YOLO + scan-duplicates)
        uses: docker/build-push-action@v6
        with:
          context: ./asana-network-service
          file: ./asana-network-service/Dockerfile
          push: true
          platforms: linux/amd64
          tags: plwatermelon/asana-network:${{ needs.resolve.outputs.version }}

      - name: Backup runner (ежедневные бэкапы OWL/S3 → Google Drive)
        uses: docker/build-push-action@v6
        with:
          context: ./backup-runner
          file: ./backup-runner/Dockerfile
          push: true
          tags: plwatermelon/asana-backup-runner:${{ needs.resolve.outputs.version }}

      - name: "Auth service (server-module — профиль, OTP, смена пароля)"
        uses: docker/build-push-action@v6
        with:
          context: ./asana-server-module
          file: ./asana-server-module/Dockerfile
          push: true
          tags: plwatermelon/server-module:${{ needs.resolve.outputs.version }}

  deploy:
    needs: [resolve, build-and-push]
    if: needs.resolve.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Освободить место на диске (Docker prune)
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'sudo bash -s' <<'CLEANUP'
          set -euo pipefail
          echo "=== Диск до очистки ==="
          df -h / | tail -1
          docker system df 2>/dev/null || true
          # Кэш сборок и «висячие» слои
          docker builder prune -af 2>/dev/null || true
          docker image prune -af 2>/dev/null || true
          # Обрезать раздутые json-логи контейнеров (частая причина 100% диска)
          find /var/lib/docker/containers -name '*-json.log' -size +50M -exec truncate -s 10M {} \; 2>/dev/null || true
          echo "=== Диск после очистки ==="
          df -h / | tail -1
          docker system df 2>/dev/null || true
          CLEANUP

      - name: Залить docker-compose и nginx на сервер (sudo)
        run: |
          cat docker-compose.prod.yml | ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'sudo tee /app/docker-compose.yml > /dev/null'
          cat nginx.prod.conf | ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'sudo tee /app/nginx.prod.conf > /dev/null'
          tar -czf - monitoring backup-runner | ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'sudo tar -xzf - -C /app'

      # Версия подставляется движком Actions до запуска shell; heredoc в одинарных кавычках — без локального $ expansion.
      - name: Обновить DICT_SERVICE_VERSION в .env, pull, down, up (3× asana-import), sudo
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'sudo bash -s' <<'REMOTE_SCRIPT'
          set -euo pipefail
          VERSION='${{ needs.resolve.outputs.version }}'
          cd /app
          if [ -f .env ] && grep -qE '^DICT_SERVICE_VERSION=' .env; then
            sed -i.bak "s|^DICT_SERVICE_VERSION=.*|DICT_SERVICE_VERSION=${VERSION}|" .env
          else
            printf '\nDICT_SERVICE_VERSION=%s\n' "${VERSION}" >> .env
          fi
          export DICT_SERVICE_VERSION="${VERSION}"
          echo "=== Остановка стека и удаление старых образов ==="
          sudo docker-compose down --remove-orphans || true
          docker image prune -af 2>/dev/null || true
          docker builder prune -af 2>/dev/null || true
          docker container prune -f 2>/dev/null || true
          df -h / | tail -1
          echo "=== Pull и запуск ==="
          sudo docker-compose pull
          sudo docker-compose up -d --scale asana-import=3
          if [ -f .env ] && grep -qE '^VLESS_URI=.' .env; then
            sudo docker-compose --profile telegram-vpn build telegram-proxy
            sudo docker-compose --profile telegram-vpn up -d telegram-proxy
          fi
          sleep 5
          sudo docker-compose exec -T nginx nginx -s reload 2>/dev/null || true
          # Одноразовый алерт в Alertmanager → Telegram (те же TELEGRAM_* из .env)
          sudo docker-compose exec -T prometheus sh -c \
            'wget -qO- --header="Content-Type: application/json" --post-data="[{\"labels\":{\"alertname\":\"DeployCompleted\",\"severity\":\"info\",\"version\":\"'"${VERSION}"'\"},\"annotations\":{\"summary\":\"Деплой завершён\",\"description\":\"Установлена версия '"${VERSION}"'\"}}]" http://alertmanager:9093/api/v2/alerts' \
            2>/dev/null || true
          REMOTE_SCRIPT
