# Продовый стек: объединяет ваш текущий compose с актуальной схемой репозитория
# (отдельный сервис импорта + Redis, маршруты в nginx.prod.conf на asana-import).
#
# Теги образов dict-service: DICT_SERVICE_VERSION в /app/.env (CI при деплое выставляет).
#
# В .env на сервере должны быть в т.ч.:
#   SMTP_HOST, URL_NETWORK_SERVER (compose подставляет их в server-module)
#   NETWORK_SERVICE_URL (опционально; по умолчанию http://server-network:8001 внутри сети)
#
# Имена и теги образов ниже — ориентир; при необходимости замените сами.

version: "3.8"

services:
  # ============================================
  # Основной сервис (asana-server-module)
  # ============================================
  server-module:
    image: plwatermelon/server-module:1.0.2-beta
    container_name: server-module
    ports:
      - "8001:8000"
    restart: unless-stopped
    environment:
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-asana_db}
      - DB_USER=${DB_USER:-asana_user}
      - DB_PASSWORD=${DB_PASSWORD:-asana_password}
      - HOST_SERVER=${HOST_SERVER:-0.0.0.0}
      - PORT_SERVER=8000
      - SECRET_KEY=${SECRET_KEY}
      - HOST_NETWORK_SERVER=${URL_NETWORK_SERVER}
      - SMTP_SERVER=${SMTP_HOST:-${SMTP_SERVER:-smtp.yandex.ru}}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM:-${SMTP_USER}}
      - HOST_MINIO=${HOST_MINIO:-minio}
      - PORT_MINIO=${PORT_MINIO:-9000}
      - USER_MINIO=${MINIO_ROOT_USER:-${USER_MINIO:-minioadmin}}
      - PASSWORD_MINIO=${MINIO_ROOT_PASSWORD:-${PASSWORD_MINIO:-minioadmin}}
      - NAME_BUCKET_IMAGES_MINIO=${NAME_BUCKET_IMAGES_MINIO:-images}
      - MINIO_URL_PREFIX=${MINIO_URL_PREFIX:-https://catalog-asan.ru/images}
      - PASSWORD_RESET_OTP_TTL_MINUTES=${PASSWORD_RESET_OTP_TTL_MINUTES:-15}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - REDIS_URL=redis://redis:6379/0
      - USER_ONLINE_WINDOW_SECONDS=${USER_ONLINE_WINDOW_SECONDS:-300}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - asana-network

  # ============================================
  # Сервис каталога асан (asana-dict-service) — основной API
  # Тяжёлый импорт/экспорт — asana-import + Redis (см. ниже).
  # Один общий файл онтологии на хосте: не запускайте параллельно тяжёлые импорты в OWL.
  # ============================================
  asana-backend:
    image: plwatermelon/asana-backend:${DICT_SERVICE_VERSION:-2.1.5-beta}
    container_name: asana-backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - MINIO_URL_PREFIX=${MINIO_URL_PREFIX:-https://catalog-asan.ru/images}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - EXPERT_USERNAME=${EXPERT_USERNAME:-expert}
      - EXPERT_PASSWORD=${EXPERT_PASSWORD:-expert123}
      - USER_MINIO=${MINIO_ROOT_USER:-${USER_MINIO:-minioadmin}}
      - PASSWORD_MINIO=${MINIO_ROOT_PASSWORD:-${PASSWORD_MINIO:-minioadmin}}
      - HOST_MINIO=${HOST_MINIO:-minio}
      - PORT_MINIO=${PORT_MINIO:-9000}
      - NAME_BUCKET_IMAGES_MINIO=${NAME_BUCKET_IMAGES_MINIO:-images}
      - S3_IMPORT_STAGING_PREFIX=${S3_IMPORT_STAGING_PREFIX:-import-staging}
      - POSTGRES_HOST=${DB_HOST:-postgres}
      - POSTGRES_PORT=${DB_PORT:-5432}
      - POSTGRES_DB=${DB_NAME:-asana_db}
      - POSTGRES_USER=${DB_USER:-asana_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-asana_password}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://server-module:8000}
      # ИИ-сервис (asana-network-service): скан дубликатов / классификация для модерации isSameAs
      - NETWORK_SERVICE_URL=${NETWORK_SERVICE_URL:-http://server-network:8001}
      - NETWORK_SERVICE_TIMEOUT=${NETWORK_SERVICE_TIMEOUT:-300}
      - NETWORK_SERVICE_BATCH_SIZE=${NETWORK_SERVICE_BATCH_SIZE:-200}
      - REDIS_URL=redis://redis:6379/0
      - USER_ONLINE_WINDOW_SECONDS=${USER_ONLINE_WINDOW_SECONDS:-300}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      server-network:
        condition: service_started
    volumes:
      - /app/ontology_updated.owl:/app/ontology_updated.owl
    networks:
      - asana-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - asana-network

  # Очередь/воркер тяжёлого импорта (тот же OWL, что у asana-backend).
  # При --scale asana-import>1 обязателен общий Redis (REDIS_URL) + healthcheck ниже — иначе статусы и lock OWL расходятся между репликами.
  # Полоска прогресса на сайте: образ asana-backend-import + фронт с опросом status; в логах воркера строка «Redis для import tasks: OK».
  asana-import:
    image: plwatermelon/asana-backend-import:${DICT_SERVICE_VERSION:-2.1.5-beta}
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=${DB_HOST:-postgres}
      - POSTGRES_PORT=${DB_PORT:-5432}
      - POSTGRES_DB=${DB_NAME:-asana_db}
      - POSTGRES_USER=${DB_USER:-asana_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-asana_password}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://server-module:8000}
      - REDIS_URL=redis://redis:6379/0
      # Фоновую синхронизацию OWL→БД запускает только asana-backend (один поток на кластер)
      - CATALOG_SYNC_BACKGROUND=false
      - OWL_PURGE_EMPTY_ASANAS_ON_START=false
      - OWL_MIGRATE_STAGING_PHOTOS_ON_START=false
      - HOST_MINIO=${HOST_MINIO:-minio}
      - PORT_MINIO=${PORT_MINIO:-9000}
      - USER_MINIO=${MINIO_ROOT_USER:-${USER_MINIO:-minioadmin}}
      - PASSWORD_MINIO=${MINIO_ROOT_PASSWORD:-${PASSWORD_MINIO:-minioadmin}}
      - NAME_BUCKET_IMAGES_MINIO=${NAME_BUCKET_IMAGES_MINIO:-images}
      - MINIO_URL_PREFIX=${MINIO_URL_PREFIX:-https://catalog-asan.ru/images}
      - S3_IMPORT_STAGING_PREFIX=${S3_IMPORT_STAGING_PREFIX:-import-staging}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /app/ontology_updated.owl:/app/ontology_updated.owl
    networks:
      - asana-network

  asana-frontend:
    image: plwatermelon/asana-frontend:${DICT_SERVICE_VERSION:-2.1.5-beta}
    container_name: asana-frontend
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - asana-backend
      - asana-import
      - server-module
    networks:
      - asana-network

  # ============================================
  # Сервис с нейронкой (asana-network-service) — образ из CI: plwatermelon/asana-network:$DICT_SERVICE_VERSION
  # ============================================
  server-network:
    image: plwatermelon/asana-network:${DICT_SERVICE_VERSION:-2.1.5-beta}
    container_name: server-network
    restart: unless-stopped
    environment:
      - HOST_SERVER=0.0.0.0
      - PORT_SERVER=8001
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/network/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - asana-network

  # ============================================
  # База данных PostgreSQL (общая для всех сервисов)
  # ============================================
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-asana_db}
      POSTGRES_USER: ${DB_USER:-asana_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-asana_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - asana-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-asana_user} -d ${DB_NAME:-asana_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================
  # MINIO S3 хранилище
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-${USER_MINIO:-minioadmin}}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-${PASSWORD_MINIO:-minioadmin}}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - asana-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Init контейнер для настройки MinIO bucket policy
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" 2>/dev/null; do
          echo 'Waiting for MinIO to be ready...'
          sleep 2
        done
        mc mb local/images --ignore-existing || true
        mc anonymous set public local/images || true
        echo 'MinIO bucket policy configured successfully'
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-${USER_MINIO:-minioadmin}}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-${PASSWORD_MINIO:-minioadmin}}
    networks:
      - asana-network

  # ============================================
  # Certbot для получения SSL сертификатов
  # ============================================
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - asana-network

  # ============================================
  # Первичная выдача/переиспользование сертификата при деплое
  # Запускается one-shot перед nginx.
  # ============================================
  certbot-init:
    image: certbot/certbot
    container_name: certbot-init
    command: >
      certonly --standalone
      --non-interactive --agree-tos --no-eff-email
      --keep-until-expiring
      --email ${LETSENCRYPT_EMAIL}
      -d catalog-asan.ru -d www.catalog-asan.ru
    ports:
      - "80:80"
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    restart: "no"
    networks:
      - asana-network

  # ============================================
  # Nginx для проксирования с SSL
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /app/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      certbot-init:
        condition: service_completed_successfully
      asana-frontend:
        condition: service_started
      asana-backend:
        condition: service_started
      asana-import:
        condition: service_started
      redis:
        condition: service_started
      server-module:
        condition: service_started
      certbot:
        condition: service_started
    networks:
      - asana-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - alertmanager
    networks:
      - asana-network

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml.template:/etc/alertmanager/alertmanager.yml.template:ro
      - ./monitoring/alertmanager/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    networks:
      - asana-network

  grafana:
    image: grafana/grafana:11.1.4
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${ADMIN_USERNAME:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-https://catalog-asan.ru/grafana/}
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - asana-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - asana-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.3
    container_name: kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_PUBLICBASEURL=${KIBANA_ROOT_URL:-https://catalog-asan.ru/kibana}
      - SERVER_BASEPATH=/kibana
      - SERVER_REWRITEBASEPATH=true
    depends_on:
      - elasticsearch
    networks:
      - asana-network

  kibana-setup:
    image: curlimages/curl:8.10.1
    container_name: kibana-setup
    restart: "no"
    volumes:
      - ./monitoring/kibana/setup.sh:/setup.sh:ro
    entrypoint: ["/bin/sh", "/setup.sh"]
    depends_on:
      - kibana
      - elasticsearch
    networks:
      - asana-network

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.14.3
    container_name: filebeat
    restart: unless-stopped
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./monitoring/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - elasticsearch
    networks:
      - asana-network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://${DB_USER:-asana_user}:${DB_PASSWORD:-asana_password}@postgres:5432/${DB_NAME:-asana_db}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - asana-network

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: redis-exporter
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - asana-network

  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: node-exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
      - "--collector.textfile.directory=/var/lib/node_exporter/textfile_collector"
    volumes:
      - /:/host:ro
      - monitoring_textfile:/var/lib/node_exporter/textfile_collector
    networks:
      - asana-network

  backup-runner:
    image: plwatermelon/asana-backup-runner:${DICT_SERVICE_VERSION:-2.1.5-beta}
    container_name: backup-runner
    restart: unless-stopped
    environment:
      - BACKUP_CRON=${BACKUP_CRON:-0 3 * * *}
      - RUN_BACKUP_ON_START=${RUN_BACKUP_ON_START:-true}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-${USER_MINIO:-minioadmin}}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-${PASSWORD_MINIO:-minioadmin}}
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=${NAME_BUCKET_IMAGES_MINIO:-images}
      - S3_BACKUP_PREFIXES=${S3_BACKUP_PREFIXES:-asans,avatars}
      - ONTOLOGY_PATH=/app/ontology_updated.owl
      - GDRIVE_REMOTE=${GDRIVE_REMOTE:-gdrive:asana-backups}
      - RCLONE_CONFIG_BASE64=${RCLONE_CONFIG_BASE64:-}
      - TEXTFILE_DIR=/var/lib/node_exporter/textfile_collector
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - /app/ontology_updated.owl:/app/ontology_updated.owl:ro
      - backup_data:/backup-data
      - ./backup-runner/rclone:/root/.config/rclone
      - monitoring_textfile:/var/lib/node_exporter/textfile_collector
    networks:
      - asana-network

volumes:
  pgdata:
  minio_data:
  prometheus_data:
  grafana_data:
  elasticsearch_data:
  backup_data:
  monitoring_textfile:

networks:
  asana-network:
    driver: bridge
