version: "3.8"

services:
  # ============================================
  # Основной сервис (asana-server-module)
  # ============================================
  server-module:
    platform: linux/amd64
    build:
      context: ./asana-server-module
      dockerfile: Dockerfile
    container_name: server-module
    ports:
      - "8001:8000"
    restart: unless-stopped
    environment:
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-asana_db}
      - DB_USER=${DB_USER:-asana_user}
      - DB_PASSWORD=${DB_PASSWORD:-asana_password}
      - HOST_SERVER=${HOST_SERVER:-0.0.0.0}
      - PORT_SERVER=8000
      - SECRET_KEY=${SECRET_KEY}
      - HOST_NETWORK_SERVER=${URL_NETWORK_SERVER}
      - SMTP_SERVER=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - HOST_MINIO=${HOST_MINIO:-minio}
      - PORT_MINIO=${PORT_MINIO:-9000}
      # Совпадают с контейнером minio (MINIO_ROOT_*); при отсутствии — fallback на USER_MINIO из .env
      - USER_MINIO=${MINIO_ROOT_USER:-${USER_MINIO:-minioadmin}}
      - PASSWORD_MINIO=${MINIO_ROOT_PASSWORD:-${PASSWORD_MINIO:-minioadmin}}
      - NAME_BUCKET_IMAGES_MINIO=${NAME_BUCKET_IMAGES_MINIO:-images}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - asana-network

  # ============================================
  # Сервис каталога асан (asana-dict-service) — основной API
  # Тяжёлый импорт/экспорт — отдельный сервис asana-import (масштаб: --scale asana-import=N + Redis).
  # Один общий файл онтологии на хосте: не запускайте параллельно тяжёлые импорты в OWL.
  # ============================================
  asana-backend:
    platform: linux/amd64
    image: asana-dict-api:${ASANA_DICT_TAG:-latest}
    build:
      context: ./asana-dict-service/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=${DB_HOST:-postgres}
      - POSTGRES_PORT=${DB_PORT:-5432}
      - POSTGRES_DB=${DB_NAME:-asana_db}
      - POSTGRES_USER=${DB_USER:-asana_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-asana_password}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://server-module:8000}
      - HOST_MINIO=${HOST_MINIO:-minio}
      - PORT_MINIO=${PORT_MINIO:-9000}
      - USER_MINIO=${MINIO_ROOT_USER:-${USER_MINIO:-minioadmin}}
      - PASSWORD_MINIO=${MINIO_ROOT_PASSWORD:-${PASSWORD_MINIO:-minioadmin}}
      - NAME_BUCKET_IMAGES_MINIO=${NAME_BUCKET_IMAGES_MINIO:-images}
      - MINIO_URL_PREFIX=${MINIO_URL_PREFIX:-http://localhost/images}
      # Только предзагрузка Excel→staging в S3 (не путать с финальным prefix=asans при apply из ячеек)
      - S3_IMPORT_STAGING_PREFIX=${S3_IMPORT_STAGING_PREFIX:-import-staging}
      # URL нейросетевого сервиса для модерации isSameAs (см. server-network ниже)
      - NETWORK_SERVICE_URL=${NETWORK_SERVICE_URL:-http://server-network:8001}
      - NETWORK_SERVICE_TIMEOUT=${NETWORK_SERVICE_TIMEOUT:-300}
      - NETWORK_SERVICE_BATCH_SIZE=${NETWORK_SERVICE_BATCH_SIZE:-200}
    depends_on:
      postgres:
        condition: service_healthy
      server-network:
        condition: service_started
    volumes:
      - ./asana-dict-service/backend/ontology_updated.owl:/app/ontology_updated.owl
      # MD-сидеры контента для страниц «О проекте» и «Инструкции для экспертов».
      # При первом запуске (пустая БД) backend подложит их содержимое в БД;
      # дальше админ редактирует тексты через UI, MD больше не подгружается.
      - ./asana-dict-service/О_ПРОЕКТЕ.md:/app/seed_content/about_project.md:ro
      - ./asana-dict-service/ИНСТРУКЦИЯ_ДЛЯ_ЭКСПЕРТОВ.md:/app/seed_content/expert_instructions.md:ro
    networks:
      - asana-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - asana-network

  asana-import:
    platform: linux/amd64
    image: asana-dict-import:${ASANA_IMPORT_TAG:-latest}
    build:
      context: ./asana-dict-service
      dockerfile: import-service/Dockerfile
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=${DB_HOST:-postgres}
      - POSTGRES_PORT=${DB_PORT:-5432}
      - POSTGRES_DB=${DB_NAME:-asana_db}
      - POSTGRES_USER=${DB_USER:-asana_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-asana_password}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://server-module:8000}
      - REDIS_URL=redis://redis:6379/0
      # Фоновую синхронизацию OWL→БД запускает только asana-backend (один поток на кластер)
      - CATALOG_SYNC_BACKGROUND=false
      # Не чистить OWL при старте воркера импорта (очистка только на asana-backend)
      - OWL_PURGE_EMPTY_ASANAS_ON_START=false
      # Миграция staging→asans только на backend (один писатель OWL)
      - OWL_MIGRATE_STAGING_PHOTOS_ON_START=false
      - HOST_MINIO=${HOST_MINIO:-minio}
      - PORT_MINIO=${PORT_MINIO:-9000}
      - USER_MINIO=${MINIO_ROOT_USER:-${USER_MINIO:-minioadmin}}
      - PASSWORD_MINIO=${MINIO_ROOT_PASSWORD:-${PASSWORD_MINIO:-minioadmin}}
      - NAME_BUCKET_IMAGES_MINIO=${NAME_BUCKET_IMAGES_MINIO:-images}
      - MINIO_URL_PREFIX=${MINIO_URL_PREFIX:-http://localhost/images}
      - S3_IMPORT_STAGING_PREFIX=${S3_IMPORT_STAGING_PREFIX:-import-staging}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./asana-dict-service/backend/ontology_updated.owl:/app/ontology_updated.owl
    networks:
      - asana-network

  asana-frontend:
    platform: linux/amd64
    image: asana-dict-frontend:${ASANA_IMPORT_TAG:-latest}
    build:
      context: ./asana-dict-service/frontend
      dockerfile: Dockerfile
    container_name: asana-frontend
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - asana-backend
      - asana-import
      - server-module
    networks:
      - asana-network

  # ============================================
  # Сервис с нейронкой (asana-network-service)
  # Используется asana-backend для модерации isSameAs:
  #   POST /ai/scan-duplicates → пакетный поиск похожих фото между разными асанами.
  # ============================================
  server-network:
    platform: linux/amd64
    build:
      context: ./asana-network-service
      dockerfile: Dockerfile
    image: server-network
    container_name: server-network
    ports:
      - "8002:8001"
    restart: unless-stopped
    environment:
      - HOST_SERVER=${HOST_NETWORK_SERVER:-0.0.0.0}
      - PORT_SERVER=${PORT_NETWORK_SERVER:-8001}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/network/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - asana-network

  
  # ============================================
  # База данных PostgreSQL (общая для всех сервисов)
  # ============================================
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-asana_db}
      POSTGRES_USER: ${DB_USER:-asana_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-asana_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - asana-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-asana_user} -d ${DB_NAME:-asana_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================
  # MINIO S3 хранилище
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      # Те же дефолты, что у backend/import: иначе при USER_MINIO в .env без MINIO_ROOT_* MinIO слушает minioadmin, а клиенты — другой ключ.
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-${USER_MINIO:-minioadmin}}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-${PASSWORD_MINIO:-minioadmin}}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - asana-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Init контейнер для настройки MinIO bucket policy
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" 2>/dev/null; do
          echo 'Waiting for MinIO to be ready...'
          sleep 2
        done
        mc mb local/images --ignore-existing || true
        mc anonymous set public local/images || true
        echo 'MinIO bucket policy configured successfully'
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-${USER_MINIO:-minioadmin}}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-${PASSWORD_MINIO:-minioadmin}}
    networks:
      - asana-network

  # ============================================
  # Nginx для проксирования
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - asana-frontend
      - asana-backend
      - asana-import
      - redis
      - server-module
    networks:
      - asana-network

volumes:
  pgdata:
  minio_data:

networks:
  asana-network:
    driver: bridge

