version: "3.8"

services:
  # ============================================
  # Основной сервис (asana-server-module)
  # ============================================
  server-module:
    build:
      context: ./asana-server-module
      dockerfile: Dockerfile
    container_name: server-module
    ports:
      - "8001:8000"
    restart: unless-stopped
    environment:
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-asana_db}
      - DB_USER=${DB_USER:-asana_user}
      - DB_PASSWORD=${DB_PASSWORD:-asana_password}
      - HOST_SERVER=${HOST_SERVER:-0.0.0.0}
      - PORT_SERVER=8000
      - SECRET_KEY=${SECRET_KEY}
      - HOST_NETWORK_SERVER=${HOST_NETWORK_SERVER}
      - SMTP_SERVER=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - HOST_MINIO=${HOST_MINIO:-minio}
      - PORT_MINIO=${PORT_MINIO:-9000}
      - USER_MINIO=${USER_MINIO:-minioadmin}
      - PASSWORD_MINIO=${PASSWORD_MINIO:-minioadmin}
      - NAME_BUCKET_IMAGES_MINIO=${NAME_BUCKET_IMAGES_MINIO:-images}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - asana-network

  # ============================================
  # Сервис каталога асан (asana-dict-service)
  # ============================================
  asana-backend:
    build:
      context: ./asana-dict-service/backend
      dockerfile: Dockerfile
    container_name: asana-backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=${DB_HOST:-postgres}
      - POSTGRES_PORT=${DB_PORT:-5432}
      - POSTGRES_DB=${DB_NAME:-asana_db}
      - POSTGRES_USER=${DB_USER:-asana_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-asana_password}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://server-module:8000}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./asana-dict-service/backend/ontology_updated.owl:/app/ontology_updated.owl
    networks:
      - asana-network

  asana-frontend:
    build:
      context: ./asana-dict-service/frontend
      dockerfile: Dockerfile
    container_name: asana-frontend
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - asana-backend
      - server-module
    networks:
      - asana-network

  # ============================================
  # База данных PostgreSQL (общая для всех сервисов)
  # ============================================
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-asana_db}
      POSTGRES_USER: ${DB_USER:-asana_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-asana_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - asana-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-asana_user} -d ${DB_NAME:-asana_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================
  # MINIO S3 хранилище
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${USER_MINIO:-minioadmin}
      - MINIO_ROOT_PASSWORD=${PASSWORD_MINIO:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - asana-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ============================================
  # Nginx для проксирования
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - asana-frontend
      - server-module
    networks:
      - asana-network

volumes:
  pgdata:
  minio_data:

networks:
  asana-network:
    driver: bridge

