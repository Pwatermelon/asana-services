<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Страница не найдена — Каталог асан</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="120x120" href="/favicon-120x120.png">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <style>
    :root {
      --bg: #f8fafc;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #6366f1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 1.5rem;
    }
    .box {
      max-width: 28rem;
      text-align: center;
    }
    .code {
      font-size: 3.5rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0 0 0.5rem;
      line-height: 1;
    }
    h1 {
      font-size: 1.35rem;
      margin: 0 0 0.65rem;
    }
    p {
      margin: 0 0 1.5rem;
      color: var(--muted);
      line-height: 1.5;
    }
    a {
      display: inline-block;
      padding: 0.7rem 1.25rem;
      border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
    a:hover { filter: brightness(1.05); }
  </style>
</head>
<body>
  <div class="box">
    <p class="code">404</p>
    <h1>Страница не найдена</h1>
    <p>Такой страницы нет на сайте. Проверьте адрес или перейдите в каталог асан.</p>
    <a href="/asanas">В каталог</a>
  </div>
</body>
</html>
