server {
    listen 80;
    server_name _;

    # Docker встроенный DNS: пересборка адреса для балансировки при --scale asana-backend=N
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ============================================
    # Мониторинг: проверка прав админа (asana-backend)
    # ============================================
    location = /internal/auth-admin {
        internal;
        set $asana_dict_upstream asana-backend;
        proxy_pass http://$asana_dict_upstream:8000/api/auth/verify-admin;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Access-Token $arg_access_token;
    }

    location = /api/auth/verify-admin {
        set $asana_dict_upstream asana-backend;
        proxy_pass http://$asana_dict_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Access-Token $arg_access_token;
    }

    location = /api/auth/monitoring-session {
        set $asana_dict_upstream asana-backend;
        proxy_pass http://$asana_dict_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/logout {
        set $asana_dict_upstream asana-backend;
        proxy_pass http://$asana_dict_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    # ============================================
    # Основной сервис (asana-server-module)
    # Используем ^~ для приоритета над общим location /api/
    # ============================================
    location ^~ /api/auth {
        proxy_pass http://server-module:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-DB-Schema dict_schema;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # /api/users/me используется в server-module для получения информации о текущем пользователе
    location ^~ /api/users/me {
        proxy_pass http://server-module:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-DB-Schema dict_schema;
        client_max_body_size 10M;
    }
    
    # /api/users/me/permission_study и другие endpoints для текущего пользователя
    location ^~ /api/users/me/ {
        proxy_pass http://server-module:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-DB-Schema dict_schema;
        client_max_body_size 10M;
    }

    # Другие эндпоинты server-module
    location ^~ /api/yoga_poses {
        proxy_pass http://server-module:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/network {
        proxy_pass http://server-module:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/result_prediction {
        proxy_pass http://server-module:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/reports {
        proxy_pass http://server-module:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/request_to_admin_status {
        proxy_pass http://server-module:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/rept {
        proxy_pass http://server-module:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================
    # Импорт/экспорт и тяжёлые операции с файлами — asana-import (масштаб: --scale asana-import=N)
    # ============================================
    location ^~ /api/import/status/ {
        set $asana_import_upstream asana-import;
        proxy_pass http://$asana_import_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_send_timeout 25s;
        proxy_read_timeout 25s;
        send_timeout 25s;
        proxy_buffering off;
        proxy_request_buffering off;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /api/import/ {
        set $asana_import_upstream asana-import;
        proxy_pass http://$asana_import_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
        client_body_timeout 3600s;
        proxy_connect_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        send_timeout 3600s;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /api/export/ {
        set $asana_import_upstream asana-import;
        proxy_pass http://$asana_import_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
    }

    location = /api/download-ontology {
        set $asana_import_upstream asana-import;
        proxy_pass http://$asana_import_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
    }

    location = /api/upload-ontology {
        set $asana_import_upstream asana-import;
        proxy_pass http://$asana_import_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
        client_body_timeout 3600s;
        proxy_connect_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        send_timeout 3600s;
    }

    location = /api/moderation/items/export {
        set $asana_import_upstream asana-import;
        proxy_pass http://$asana_import_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
    }

    # ============================================
    # API каталога асан (asana-dict-service) — основной бэкенд
    # proxy_pass через переменную + resolver — при необходимости можно масштабировать реплики asana-backend
    # ============================================
    location /api/ {
        set $asana_dict_upstream asana-backend;
        proxy_pass http://$asana_dict_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
    }

    # ============================================
    # MinIO S3 хранилище (для изображений)
    # ============================================
    location /images/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        send_timeout 300;
        client_max_body_size 100M;
    }

    # ============================================
    # Grafana (мониторинг)
    # ============================================
    location = /grafana {
        return 301 /grafana/;
    }

    location ^~ /grafana/ {
        auth_request /internal/auth-admin;
        auth_request_set $auth_status $upstream_status;
        error_page 401 = @monitoring_login;
        error_page 403 = @monitoring_forbidden;
        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /grafana;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ============================================
    # Kibana (логи)
    # ============================================
    location = /kibana {
        return 301 /kibana/;
    }

    location ^~ /kibana/ {
        auth_request /internal/auth-admin;
        auth_request_set $auth_status $upstream_status;
        error_page 401 = @monitoring_login;
        error_page 403 = @monitoring_forbidden;
        proxy_pass http://kibana:5601;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location @monitoring_login {
        return 302 /login?next=$request_uri;
    }

    location @monitoring_forbidden {
        internal;
        set $asana_dict_upstream asana-backend;
        proxy_pass http://$asana_dict_upstream:8000/api/auth/access-denied?code=403;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================
    # Frontend (React приложение)
    # ============================================
    location / {
        proxy_pass http://asana-frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

