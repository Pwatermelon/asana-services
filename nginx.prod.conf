# Production Nginx конфигурация для catalog-asan.ru
# HTTPS с Let's Encrypt сертификатами
#
# asana-backend / asana-import — proxy_pass через переменную + resolver 127.0.0.11 в server {},
# чтобы nginx не требовал резолв имён при старте (контейнеры могут подняться позже бэкенда).

# Редирект HTTP на HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name catalog-asan.ru www.catalog-asan.ru;

    # Для Let's Encrypt верификации
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Редирект всего остального на HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS сервер
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name catalog-asan.ru www.catalog-asan.ru;

    # SSL сертификаты
    ssl_certificate /etc/letsencrypt/live/catalog-asan.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/catalog-asan.ru/privkey.pem;

    # SSL настройки безопасности
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/catalog-asan.ru/chain.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Размеры загрузки
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Таймауты
    proxy_connect_timeout 600;
    proxy_send_timeout 600;
    proxy_read_timeout 600;
    send_timeout 600;

    # Короткий повтор при обрыве upstream (рестарт воркера uvicorn и т.п.)
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;

    # Логирование
    access_log /var/log/nginx/katalog-asan-access.log;
    error_log /var/log/nginx/katalog-asan-error.log;

    # ============================================
    # Основной сервис авторизации (server-module)
    # ============================================
    location ^~ /api/auth {
        proxy_pass http://server-module:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-DB-Schema $http_x_db_schema;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ^~ /api/users/me {
        proxy_pass http://server-module:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-DB-Schema $http_x_db_schema;
    }

    location ^~ /api/users/me/ {
        proxy_pass http://server-module:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-DB-Schema $http_x_db_schema;
    }

    location ^~ /api/yoga_poses {
        proxy_pass http://server-module:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/network {
        proxy_pass http://server-module:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/result_prediction {
        proxy_pass http://server-module:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/reports {
        proxy_pass http://server-module:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/request_to_admin_status {
        proxy_pass http://server-module:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/rept {
        proxy_pass http://server-module:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================
    # Импорт/экспорт — asana-import
    # ============================================
    # Poll GET /api/import/status/… каждые ~200 ms — отдельно от тяжёлых POST: короткие таймауты и без буферизации,
    # иначе на HTTP/2 + длинных таймаутах у общего /api/import/ третий запрос часто «висит» в браузере (pending).
    location ^~ /api/import/status/ {
        set $asana_import_upstream asana-import;
        proxy_pass http://$asana_import_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_send_timeout 25s;
        proxy_read_timeout 25s;
        send_timeout 25s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /api/import/ {
        set $asana_import_upstream asana-import;
        proxy_pass http://$asana_import_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        client_max_body_size 100M;
        # Медленная загрузка Excel с клиента (axios до 1 ч) — дефолтный client_body_timeout 60s обрывает раньше
        client_body_timeout 3600s;
        proxy_connect_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        send_timeout 3600s;
        # Статус импорта (GET) не кэшировать у nginx — полоска «застывает», если ответ закэширован на границе
        add_header Cache-Control "no-store" always;
    }

    location ^~ /api/export/ {
        set $asana_import_upstream asana-import;
        proxy_pass http://$asana_import_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        client_max_body_size 100M;
    }

    location = /api/download-ontology {
        set $asana_import_upstream asana-import;
        proxy_pass http://$asana_import_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        client_max_body_size 100M;
    }

    location = /api/upload-ontology {
        set $asana_import_upstream asana-import;
        proxy_pass http://$asana_import_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        client_max_body_size 100M;
        client_body_timeout 3600s;
        proxy_connect_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        send_timeout 3600s;
    }

    location = /api/moderation/items/export {
        set $asana_import_upstream asana-import;
        proxy_pass http://$asana_import_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        client_max_body_size 100M;
    }

    # ============================================
    # API каталога асан (asana-dict-service) — основной бэкенд
    # ============================================
    location /api/ {
        set $asana_dict_upstream asana-backend;
        proxy_pass http://$asana_dict_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 100M;
    }

    # ============================================
    # MinIO S3 хранилище (для изображений)
    # ============================================
    location /images/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        send_timeout 300;
        client_max_body_size 100M;
    }

    # ============================================
    # Frontend (React приложение)
    # ============================================
    location / {
        proxy_pass http://asana-frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }


    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

